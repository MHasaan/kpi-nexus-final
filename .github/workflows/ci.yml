name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# OT-007: CI had never passed. pnpm/action-setup was given `version: 9` while
# package.json declares `"packageManager": "pnpm@9.15.0"`, so every pnpm job
# died at setup ("Multiple versions of pnpm specified"). The version now comes
# from packageManager alone. Node 22 (20 is end-of-life); actions on the Node 24
# runtime (no deprecation annotations).

jobs:
  node:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo ${{ matrix.task }}

  ml:
    name: ml-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt
      - run: pip install -r apps/ml/requirements.txt
      - run: pytest
        working-directory: apps/ml

  # The E2E suite drives the real stack: it registers orgs, records data and
  # reads mail, so it needs Postgres (TimescaleDB + pgvector), Redis, Mailhog
  # and a running API — previously none were provided (OT-007).
  e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # Same image as infra/docker/docker-compose.yml (TimescaleDB + pgvector).
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: kpi_nexus
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: kpi_nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kpi_nexus -d kpi_nexus"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ['1025:1025', '8025:8025']
    env:
      CI: 'true'
      DATABASE_URL: postgresql://kpi_nexus:ci_only_password@127.0.0.1:5432/kpi_nexus
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      # CI-only throwaway secret; NODE_ENV stays non-production so the dev
      # defaults for the other secrets are accepted (see apps/api/src/config/secrets.ts).
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      NODE_ENV: development
      WEB_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      # Deterministic AI: every provider resolves to the mock (no keys in CI).
      AI_MOCK: '1'
      # No trace collector in CI; .env.example points at a local Jaeger. Empty
      # (still set, so the API's early .env load can't override it) = tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      # The suite registers many orgs from one IP — relax the per-IP budgets.
      RATE_LIMIT_AUTH_PER_MIN: '1000'
      RATE_LIMIT_USER_PER_MIN: '100000'
      RATE_LIMIT_ANON_PER_MIN: '100000'
      RATE_LIMIT_LOGIN_PER_ACCOUNT: '100'
      RATE_LIMIT_ONBOARDING_START_PER_HOUR: '1000'
      RATE_LIMIT_ONBOARDING_AI_PER_HOUR: '1000'
      # Row-level security enforced (OT-014): requests run as kpi_app, system
      # work as kpi_system. db:setup creates both roles with these passwords.
      RLS_ENFORCED: 'true'
      KPI_APP_DB_PASSWORD: ci_only_app_password
      KPI_SYSTEM_DB_PASSWORD: ci_only_system_password
      DATABASE_URL_APP: postgresql://kpi_app:ci_only_app_password@127.0.0.1:5432/kpi_nexus
      DATABASE_URL_SYSTEM: postgresql://kpi_system:ci_only_system_password@127.0.0.1:5432/kpi_nexus
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Env files (values above take precedence)
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
      - name: Database schema, RLS policies, hypertables
        run: pnpm db:setup
      - name: Build API + web (and their workspace deps)
        run: pnpm turbo build --filter=@kpi-nexus/api... --filter=@kpi-nexus/web...
      # One canned JSON every AI parser accepts (guarded by
      # apps/api/src/ai/ai-mock-fixture.spec.ts) — deterministic AI features.
      - name: Canned AI response
        run: |
          echo "AI_MOCK_RESPONSE=$(node -e "process.stdout.write(JSON.stringify(require('./apps/api/test/fixtures/ai-mock-response.json')))")" >> "$GITHUB_ENV"
      - name: Start API
        working-directory: apps/api
        run: |
          nohup node dist/main.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat "$GITHUB_WORKSPACE/api.log"; exit 1
      # Live API integration suite — includes the cross-tenant fuzz and the
      # RLS enforcement tests (which connect as kpi_app / kpi_system directly).
      - name: API integration tests (live, RLS enforced)
        run: pnpm --filter @kpi-nexus/api test:int
      - name: Install Playwright browsers
        run: pnpm --filter @kpi-nexus/web exec playwright install --with-deps chromium
      # playwright.config.ts serves the production build (`next start`) under CI.
      - run: pnpm --filter @kpi-nexus/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
          retention-days: 7
