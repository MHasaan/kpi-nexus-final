name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# OT-007: CI had never passed. pnpm/action-setup was given `version: 9` while
# package.json declares `"packageManager": "pnpm@9.15.0"`, so every pnpm job
# died at setup ("Multiple versions of pnpm specified"). The version now comes
# from packageManager alone. Node 22 (20 is end-of-life); actions on the Node 24
# runtime (no deprecation annotations).

jobs:
  # OT-011 / ADR-001: the production images. Build only; no registry push.
  # Production runs on an ARM VM (ADR-001), so every image is built and checked
  # on a native arm64 runner as well as amd64.
  api-image:
    name: api-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Build apps/api/Dockerfile
        run: docker build -f apps/api/Dockerfile --build-arg APP_VERSION="$GITHUB_SHA" -t kpi-nexus-api:ci .
      - name: Image runs as non-root and carries the release script
        run: |
          test "$(docker run --rm kpi-nexus-api:ci id -un)" = node
          docker run --rm kpi-nexus-api:ci test -f node_modules/@kpi-nexus/db/scripts/release-db.mjs
          docker run --rm kpi-nexus-api:ci test -f dist/worker.js
          test "$(docker run --rm kpi-nexus-api:ci uname -m)" = "$(uname -m)"
          test "$(docker run --rm kpi-nexus-api:ci printenv APP_VERSION)" = "$GITHUB_SHA"
      - name: ML sidecar image builds and answers /health
        run: |
          docker build -t kpi-nexus-ml:ci apps/ml
          docker run -d --name ml -p 8000:8000 kpi-nexus-ml:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs ml; exit 1
      # A new volume can be root-owned; the image must still initialise there,
      # and the schema owner it creates must not be a superuser (OT-011).
      - name: Postgres image boots on a root-owned volume
        run: |
          docker build -t kpi-nexus-db:ci infra/prod/postgres
          mkdir -p "$RUNNER_TEMP/pgvol" && sudo chown root:root "$RUNNER_TEMP/pgvol"
          docker run -d --name proddb -v "$RUNNER_TEMP/pgvol:/home/postgres/pgdata" \
            -e POSTGRES_PASSWORD=ci-superuser -e KPI_OWNER_DB_PASSWORD=ci-owner kpi-nexus-db:ci
          for i in $(seq 1 60); do
            docker exec proddb pg_isready -U postgres -d kpi_nexus >/dev/null 2>&1 && break
            sleep 2
          done
          docker logs proddb 2>&1 | tail -n 5
          test "$(docker exec proddb psql -U postgres -d kpi_nexus -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname = 'kpi_nexus'")" = f
          test "$(docker exec proddb psql -U postgres -d kpi_nexus -tAc \
            "SELECT count(*) FROM pg_extension WHERE extname IN ('timescaledb', 'vector')")" = 2
      # The production database release, from the API image, on that database:
      # once on an empty schema, then again (every deploy re-runs it).
      - name: Database release from the image, twice
        run: |
          for run in 1 2; do
            docker run --rm --network container:proddb \
              -e DATABASE_URL=postgresql://kpi_nexus:ci-owner@127.0.0.1:5432/kpi_nexus \
              -e KPI_APP_DB_PASSWORD=ci-app -e KPI_SYSTEM_DB_PASSWORD=ci-system \
              kpi-nexus-api:ci node node_modules/@kpi-nexus/db/scripts/release-db.mjs
          done

  # The scripts that run on the production VM and in the database image
  # (ADR-001). shellcheck is preinstalled on GitHub's Ubuntu runners.
  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version && shellcheck infra/prod/*.sh infra/prod/postgres/*.sh infra/prod/postgres/initdb/*.sh

  node:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm turbo ${{ matrix.task }}

  ml:
    name: ml-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt
      - run: pip install -r apps/ml/requirements.txt
      - run: pytest
        working-directory: apps/ml

  # The E2E suite drives the real stack: it registers orgs, records data and
  # reads mail, so it needs Postgres (TimescaleDB + pgvector), Redis, Mailhog
  # and a running API — previously none were provided (OT-007).
  e2e:
    name: web-e2e
    # Playwright 1.60 supports Ubuntu 24.04, not the 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        # Same image as infra/docker/docker-compose.yml (TimescaleDB + pgvector).
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: kpi_nexus
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: kpi_nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kpi_nexus -d kpi_nexus"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ['1025:1025', '8025:8025']
    env:
      CI: 'true'
      DATABASE_URL: postgresql://kpi_nexus:ci_only_password@127.0.0.1:5432/kpi_nexus
      REDIS_URL: redis://127.0.0.1:6379
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      # CI-only throwaway secret; NODE_ENV stays non-production so the dev
      # defaults for the other secrets are accepted (see apps/api/src/config/secrets.ts).
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      NODE_ENV: development
      WEB_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      # Deterministic AI: every provider resolves to the mock (no keys in CI).
      AI_MOCK: '1'
      # No trace collector in CI; .env.example points at a local Jaeger. Empty
      # (still set, so the API's early .env load can't override it) = tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      # The suite registers many orgs from one IP — relax the per-IP budgets.
      RATE_LIMIT_AUTH_PER_MIN: '1000'
      RATE_LIMIT_USER_PER_MIN: '100000'
      RATE_LIMIT_ANON_PER_MIN: '100000'
      RATE_LIMIT_LOGIN_PER_ACCOUNT: '100'
      RATE_LIMIT_ONBOARDING_START_PER_HOUR: '1000'
      RATE_LIMIT_ONBOARDING_AI_PER_HOUR: '1000'
      # Row-level security enforced (OT-014): requests run as kpi_app, system
      # work as kpi_system. The database release creates both roles with these passwords.
      RLS_ENFORCED: 'true'
      KPI_APP_DB_PASSWORD: ci_only_app_password
      KPI_SYSTEM_DB_PASSWORD: ci_only_system_password
      DATABASE_URL_APP: postgresql://kpi_app:ci_only_app_password@127.0.0.1:5432/kpi_nexus
      DATABASE_URL_SYSTEM: postgresql://kpi_system:ci_only_system_password@127.0.0.1:5432/kpi_nexus
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Env files (values above take precedence)
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
      # Report integration tests upload files; use the same pinned gateway as local dev.
      - name: Start S3-compatible report storage
        run: |
          docker run --detach --name kpi-ci-s3 --publish 9000:9000 \
            --volume "$GITHUB_WORKSPACE/infra/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d mini -dir=/data -s3.port=9000 \
            -s3.config=/etc/seaweedfs/s3.json -bucket=kpi-nexus-local -master.telemetry=false
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000 || true)
            if [ "$status" = 403 ]; then exit 0; fi
            sleep 2
          done
          docker logs kpi-ci-s3
          exit 1
      - name: Prisma client
        run: pnpm db:generate
      # The production path (OT-011): append-only migrations plus the shared SQL
      # (RLS, hypertables, aggregates). Run twice — every deploy re-runs it.
      - name: Database release (migrate deploy, RLS, hypertables), twice
        run: |
          pnpm db:release
          pnpm db:release
      # Local dev builds the schema with `db push`; the two must not drift.
      - name: Migrations reproduce schema.prisma
        run: pnpm db:check-migrations
      - name: Build API + web (and their workspace deps)
        run: pnpm turbo build --filter=@kpi-nexus/api... --filter=@kpi-nexus/web...
      # One canned JSON every AI parser accepts (guarded by
      # apps/api/src/ai/ai-mock-fixture.spec.ts) — deterministic AI features.
      - name: Canned AI response
        run: |
          echo "AI_MOCK_RESPONSE=$(node -e "process.stdout.write(JSON.stringify(require('./apps/api/test/fixtures/ai-mock-response.json')))")" >> "$GITHUB_ENV"
      - name: Start API
        working-directory: apps/api
        run: |
          nohup node dist/main.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/api.pid"
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat "$GITHUB_WORKSPACE/api.log"; exit 1
      - name: Fresh database billing regression (before catalog initialization)
        run: pnpm --filter @kpi-nexus/api test:fresh-db
        env:
          BILLING_FRESH_DB_TEST: 'true'
      # Live API integration suite — includes the cross-tenant fuzz and the
      # RLS enforcement tests (which connect as kpi_app / kpi_system directly).
      - name: API integration tests (live, RLS enforced)
        run: pnpm --filter @kpi-nexus/api test:int
      - name: Install Playwright browsers
        run: pnpm --filter @kpi-nexus/web exec playwright install --with-deps chromium
      # playwright.config.ts serves the production build (`next start`) under CI.
      - run: pnpm --filter @kpi-nexus/web test:e2e
      # OT-003: rerun the queue-dependent specs with the processors moved out of
      # the API into the worker process — the production layout.
      - name: Queue integration tests (API + separate worker)
        working-directory: apps/api
        run: |
          kill "$(cat "$GITHUB_WORKSPACE/api.pid")"
          while curl -sf http://localhost:4000/health >/dev/null; do sleep 1; done
          RUN_QUEUE_WORKERS=false nohup node dist/main.js > "$GITHUB_WORKSPACE/api-split.log" 2>&1 &
          nohup node dist/worker.js > "$GITHUB_WORKSPACE/worker.log" 2>&1 &
          # Logs go through an async transport, so a line can land after /health
          # answers: wait for all three signals, and show the logs if they never come.
          ready=
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health >/dev/null \
              && grep -q 'Queue processors OFF' "$GITHUB_WORKSPACE/api-split.log" \
              && grep -q 'kpi-nexus-worker started' "$GITHUB_WORKSPACE/worker.log"; then
              ready=1; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "Split mode did not start"; tail -n 40 "$GITHUB_WORKSPACE/api-split.log" "$GITHUB_WORKSPACE/worker.log"; exit 1
          fi
          pnpm exec vitest run --config vitest.int.config.ts \
            test/integration/alerting.spec.ts \
            test/integration/scheduled-report.spec.ts \
            test/integration/invitation-email.spec.ts \
            test/integration/password-reset.spec.ts \
            test/integration/jira-webhook.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            api-split.log
            worker.log
          retention-days: 7
