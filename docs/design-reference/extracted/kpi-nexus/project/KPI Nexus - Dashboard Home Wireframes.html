<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KPI Nexus — Dashboard Home Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Caveat:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #efece4; }
  * { -webkit-font-smoothing: antialiased; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframe-kit.jsx"></script>
<script type="text/babel" src="homes.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "annotations": true,
  "accent": true
}/*EDITMODE-END*/;

function ArtCaption({ title, sub }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ font: "700 16px/1.1 'Kalam', cursive", color: "#33312e" }}>{title}</div>
      <div style={{ font: "400 15px/1.25 'Caveat', cursive", color: "#6b6862", marginTop: 1, maxWidth: 760 }}>{sub}</div>
    </div>
  );
}

// margin column of annotations — hidden when the Annotations tweak is off
function Notes({ items }) {
  const ctx = React.useContext(WFContext);
  if (!ctx.showNotes) return null;
  return (
    <div style={{ width: 226, flex: "none", paddingTop: 4, display: "flex", flexDirection: "column", gap: 13 }}>
      <div style={{ font: "700 12px/1 'Kalam', cursive", letterSpacing: ".5px", textTransform: "uppercase", color: "#c2502f", opacity: .8 }}>Notes</div>
      {items.map((it, i) => (
        <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
          <span style={{ font: "700 14px/1.1 'Caveat', cursive", color: "#c2502f", flex: "none", minWidth: 14 }}>{i + 1}</span>
          <span style={{ font: "400 16px/1.22 'Caveat', cursive", color: "#c2502f" }}>{it}</span>
        </div>
      ))}
    </div>
  );
}

// caption (full width) + a row of [ framed shell | margin notes ]
function Board({ title, sub, children, notes }) {
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: 16, background: "#fff", boxSizing: "border-box" }}>
      <ArtCaption title={title} sub={sub} />
      <div style={{ flex: 1, display: "flex", gap: 22, minHeight: 0 }}>
        <div style={{ width: 1180, flex: "none", border: "1.5px solid #33312e", borderRadius: 12, overflow: "hidden" }}>{children}</div>
        <Notes items={notes} />
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const ctx = { showNotes: t.annotations, accentOn: t.accent, density: "comfortable" };

  const AW = 1462, AH = 778;

  return (
    <WFContext.Provider value={ctx}>
      <DesignCanvas>
        <DCSection id="home" title="Dashboard home · /dashboard" subtitle="Role-adaptive landing — three structural directions. Low-fi wireframes within the app shell.">
          <DCArtboard id="classic" label="1 · Classic grid" width={AW} height={AH}>
            <Board title="Classic grid"
              sub="Full sidebar · stat-tile summary + KPI card grid · checklist & activity rail. Familiar, scannable, admin-leaning."
              notes={[
                "Role-adaptive greeting + ADMIN badge — admins land on org health.",
                "Stat tiles: tabular numerals · sparkline · ▲/▼ delta icon (never colour alone).",
                "Sidebar nav is permission-filtered — hide what the viewer can't access.",
                "Right rail is admin-only: setup checklist (9/14) + recent activity.",
                "Exactly one sky-accent button: the primary 'Create KPI' CTA.",
              ]}>
              <HomeClassic />
            </Board>
          </DCArtboard>

          <DCArtboard id="feed" label="2 · Attention feed" width={AW} height={AH}>
            <Board title="Attention feed"
              sub="Collapsed icon-rail · a priority feed of alerts/AI/approvals/tasks first · KPIs demoted to a glance strip. Action-leaning, manager/individual."
              notes={[
                "Attention-first ordering: alerts → AI → approvals → tasks, by priority.",
                "Collapsed icon-rail reclaims horizontal width for the feed.",
                "Inline row actions are optimistic — flip now, roll back on failure.",
                "Metrics demoted to a glanceable strip; managers act, then scan.",
                "MANAGER view: feed and KPIs are scoped to the viewer's team.",
              ]}>
              <HomeFeed />
            </Board>
          </DCArtboard>

          <DCArtboard id="command" label="3 · Command center" width={AW} height={AH}>
            <Board title="Command center"
              sub="Nav rail + dense scorecard table + always-on AI / activity panel. Power-user, keyboard-first, maximum data density."
              notes={[
                "Compact density: the scorecard table handles 10–100 rows.",
                "Sortable, keyboard-navigable rows; scope badge per KPI.",
                "Always-on AI / activity side rail (tabbed).",
                "Ask (NLQ) is grounded in your visible data · respects permissions.",
                "AI cards carry trust signals: confidence + model + cost.",
              ]}>
              <HomeCommand />
            </Board>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Wireframe" />
        <TweakToggle label="Annotations" value={t.annotations} onChange={(v) => setTweak('annotations', v)} />
        <TweakToggle label="Sky accent" value={t.accent} onChange={(v) => setTweak('accent', v)} />
      </TweaksPanel>
    </WFContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0b84c6"/>
    <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
      <rect x="30" y="30" width="40" height="40" rx="6"/>
      <path d="M38 58 L46 48 L54 53 L62 40"/>
    </g>
  </svg>
</template>
</body>
</html>
