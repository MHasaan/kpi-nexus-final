<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Nexus — Web App UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--c-surface-bg);
    color: var(--c-default);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv02','cv03','cv04','cv11','ss01';
  }
  #root { height: 100vh; }
  ::selection { background: hsl(var(--accent-primary) / 0.22); }
  /* scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: hsl(var(--border-strong) / 0.7); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-track { background: transparent; }
  .kn-btn:hover { filter: brightness(0.96); }
  .kn-btn-secondary:hover, .kn-btn-ghost:hover { background: var(--c-surface-hover) !important; filter: none; }
  .kn-btn:active { transform: translateY(0.5px); }
  .kn-iconbtn:hover { background: var(--c-surface-hover); color: var(--c-strong); }
  .kn-card-hover { transition: box-shadow var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); }
  .kn-card-hover:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: hsl(var(--accent-primary) / 0.35); }
  @keyframes knPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .kn-pulse { animation: knPulse 1.8s ease-in-out infinite; }
  input::placeholder { color: var(--c-muted); }

  /* ---- Motion: calm entrance (≤ one beat, ease-out) -------------------- */
  /* On-load entrances are transform-only so content is NEVER gated behind
     opacity (robust even if the animation clock is throttled). */
  @keyframes knFadeUp { from { transform: translateY(10px); } to { transform: none; } }
  @keyframes knFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes knPop { 0% { opacity: 0; transform: scale(0.96); } 100% { opacity: 1; transform: none; } }
  @keyframes knSlideIn { from { transform: translateX(100%); } to { transform: none; } }
  .kn-view { animation: knFadeUp var(--dur-slow) var(--ease-out) both; }
  .kn-stagger > * { animation: knFadeUp var(--dur-slow) var(--ease-out) both; }
  .kn-stagger > *:nth-child(1) { animation-delay: 0ms; }
  .kn-stagger > *:nth-child(2) { animation-delay: 40ms; }
  .kn-stagger > *:nth-child(3) { animation-delay: 80ms; }
  .kn-stagger > *:nth-child(4) { animation-delay: 120ms; }
  .kn-stagger > *:nth-child(5) { animation-delay: 160ms; }
  .kn-stagger > *:nth-child(6) { animation-delay: 200ms; }
  .kn-pop { animation: knPop var(--dur-base) var(--ease-out) forwards; }

  /* ---- Aura: soft accent glow on focal elements ----------------------- */
  /* A faint conic/radial bloom — used sparingly behind the brand mark,
     the AI avatar, the primary CTA on hover, and the active nav item. */
  .kn-aura { position: relative; isolation: isolate; }
  .kn-aura::before {
    content: ''; position: absolute; inset: -40%; z-index: -1; border-radius: inherit;
    background: radial-gradient(closest-side, hsl(var(--accent-primary) / 0.45), transparent 70%);
    filter: blur(14px); opacity: 0.0; transition: opacity var(--dur-slow) var(--ease-out);
  }
  .kn-aura-on::before { opacity: 1; }
  .kn-aura-soft::before { opacity: 0.55; }
  /* Breathing aura for the live AI mark */
  @keyframes knBreathe { 0%,100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.08); } }
  .kn-aura-breathe::before { opacity: 0.5; animation: knBreathe 3.2s var(--ease-in-out) infinite; }
  /* Primary button: aura blooms on hover */
  .kn-btn-primary { position: relative; isolation: isolate; }
  .kn-btn-primary::after {
    content: ''; position: absolute; inset: -1px; z-index: -1; border-radius: inherit;
    box-shadow: 0 0 0 0 hsl(var(--accent-primary) / 0.5);
    transition: box-shadow var(--dur-slow) var(--ease-out);
  }
  .kn-btn-primary:hover::after { box-shadow: 0 4px 22px -2px hsl(var(--accent-primary) / 0.55); }

  /* ---- Sheen sweep across the brand gradient (very slow) --------------- */
  @keyframes knSheen { 0% { background-position: -120% 0; } 60%,100% { background-position: 220% 0; } }
  .kn-sheen { position: relative; overflow: hidden; }
  .kn-sheen::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, hsl(0 0% 100% / 0.35) 50%, transparent 70%);
    background-size: 220% 100%; animation: knSheen 6s var(--ease-in-out) infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Lucide (vanilla UMD) — exposes window.lucide before React renders -->

  <!-- React + Babel (pinned) -->

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lib.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>
  <script type="text/babel" src="widgets.jsx"></script>
  <script type="text/babel" src="views-intel.jsx"></script>
  <script type="text/babel" src="views-execute.jsx"></script>
  <script type="text/babel" src="views-org.jsx"></script>
  <script type="text/babel" src="views-kpitabs.jsx"></script>

</html>
