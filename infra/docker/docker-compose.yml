name: kpi-nexus

# Images are pinned (audit OT-011): a moving tag changed what "docker:up" ran.
# Bump deliberately: pull, test, then update the tag/digest here.
services:
  postgres:
    image: timescale/timescaledb-ha:pg16@sha256:0bb4a5e5c0e24119852612dee28694d71333820b33fafeb7968497e1faf4c182
    container_name: kpi-nexus-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kpi_nexus
      POSTGRES_USER: kpi_nexus
      POSTGRES_PASSWORD: dev_password
    volumes:
      # timescaledb-ha keeps its cluster in PGDATA=/home/postgres/pgdata/data, not
      # /var/lib/postgresql/data. Mounting the old path persisted nothing: the DB
      # lived in the container layer and was lost whenever the container was
      # recreated (e.g. `docker compose down`, an image bump).
      - pg_home:/home/postgres/pgdata
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi_nexus -d kpi_nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:286bd4264adb303147270bb2d735352497e950f7b73b2ca42364d63d7daf61ee
    container_name: kpi-nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # MinIO stopped publishing community images (Docker Hub: "repository does not
    # exist"; quay.io needs auth) — this digest (RELEASE.2025-09-07T16-13-09Z) only
    # resolves where it is already cached. A fresh machine needs another
    # S3-compatible store; see docs/audit/other.md OT-011.
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: kpi-nexus-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1 # final release; project unmaintained since 2020
    container_name: kpi-nexus-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  jaeger:
    image: jaegertracing/all-in-one:latest@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: kpi-nexus-jaeger
    ports:
      - "16686:16686"  # Web UI
      - "4318:4318"    # OTLP HTTP

volumes:
  pg_home:
  redis_data:
  minio_data:
