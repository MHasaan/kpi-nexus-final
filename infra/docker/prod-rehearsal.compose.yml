name: kpi-rehearsal

# Production rehearsal (OT-011) — never for day-to-day dev. Runs the images and
# process commands from infra/fly/*.toml in production mode, with local
# stand-ins: redis for Upstash, SeaweedFS for R2, MailHog for Resend, and the
# web app via `next start` for Vercel. Its own ports (+30000) and volumes, so it
# never touches the dev stack. The app containers use host networking (Linux).
#
#   1. cp infra/docker/prod-rehearsal.env.example infra/docker/prod-rehearsal.env
#      and fill it in (generator command inside; the file is git-ignored)
#   2. docker compose --env-file infra/docker/prod-rehearsal.env \
#        -f infra/docker/prod-rehearsal.compose.yml up -d --build
#      (db → release → api + worker; the release must exit 0)
#   3. Web, built against this API like Vercel would:
#        NEXT_PUBLIC_API_URL=http://127.0.0.1:4400 pnpm turbo build --filter=@kpi-nexus/web...
#        pnpm --filter @kpi-nexus/web exec next start -p 3400
#   4. docker compose ... down -v   (drops the rehearsal volumes)

x-app-env: &app-env
  NODE_ENV: production
  PORT: "4400"
  RLS_ENFORCED: "true"
  DATABASE_URL: postgresql://kpi_nexus:${KPI_OWNER_DB_PASSWORD}@127.0.0.1:35432/kpi_nexus
  DATABASE_URL_APP: postgresql://kpi_app:${KPI_APP_DB_PASSWORD}@127.0.0.1:35432/kpi_nexus
  DATABASE_URL_SYSTEM: postgresql://kpi_system:${KPI_SYSTEM_DB_PASSWORD}@127.0.0.1:35432/kpi_nexus
  KPI_APP_DB_PASSWORD: ${KPI_APP_DB_PASSWORD}
  KPI_SYSTEM_DB_PASSWORD: ${KPI_SYSTEM_DB_PASSWORD}
  REDIS_URL: redis://127.0.0.1:36379
  ML_SIDECAR_URL: http://127.0.0.1:38000
  S3_ENDPOINT: http://127.0.0.1:39000
  S3_REGION: us-east-1
  S3_BUCKET: kpi-nexus-local
  S3_ACCESS_KEY: kpinexus
  S3_SECRET_KEY: kpinexus-dev-secret
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "31025"
  SMTP_FROM: KPI Nexus <noreply@kpi-nexus.local>
  WEB_APP_URL: http://localhost:3400
  CORS_ALLOWED_ORIGINS: http://localhost:3400,http://127.0.0.1:3400
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # Secrets and the optional test-suite settings come from env_file (below),
  # so a variable reaches the containers only when the file sets it: an
  # empty AI_MOCK_RESPONSE would switch on mock AI, an empty limit means 0.

services:
  db:
    # infra/fly/postgres: volume ownership fix + non-superuser owner at first boot.
    build: ../fly/postgres
    image: kpi-nexus-db:rehearsal
    ports: ["127.0.0.1:35432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KPI_OWNER_DB_PASSWORD: ${KPI_OWNER_DB_PASSWORD}
    volumes: [pgdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kpi_nexus"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:286bd4264adb303147270bb2d735352497e950f7b73b2ca42364d63d7daf61ee
    ports: ["127.0.0.1:36379:6379"]

  s3:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # 4.48
    ports: ["127.0.0.1:39000:9000"]
    command: [mini, -dir=/data, -s3.port=9000, -s3.config=/etc/seaweedfs/s3.json, -bucket=kpi-nexus-local, -master.telemetry=false]
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["127.0.0.1:31025:1025", "127.0.0.1:38025:8025"]

  ml:
    build: ../../apps/ml
    image: kpi-nexus-ml:rehearsal
    network_mode: host
    environment:
      ENV: production
      ML_SIDECAR_HMAC_SECRET: ${ML_SIDECAR_HMAC_SECRET}
    command: [uvicorn, app.main:app, --host, 127.0.0.1, --port, "38000"]

  # The Fly release_command, run once before the app processes start.
  release:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: kpi-nexus-api:rehearsal
    network_mode: host
    env_file: prod-rehearsal.env
    environment: *app-env
    command: [node, node_modules/@kpi-nexus/db/scripts/release-db.mjs]
    depends_on:
      db: { condition: service_healthy }

  api:
    image: kpi-nexus-api:rehearsal
    network_mode: host
    env_file: prod-rehearsal.env
    environment: *app-env
    # Same as [processes] app in infra/fly/api.toml.
    command: [env, RUN_QUEUE_WORKERS=false, node, --import, ./dist/instrumentation.js, dist/main.js]
    depends_on:
      release: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    image: kpi-nexus-api:rehearsal
    network_mode: host
    env_file: prod-rehearsal.env
    environment: *app-env
    # Same as [processes] worker in infra/fly/api.toml.
    command: [node, dist/worker.js]
    depends_on:
      release: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  pgdata:
  s3data:
