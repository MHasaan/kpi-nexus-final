# KPI Nexus API + queue worker on Fly.io (OT-011). One image, two processes.
# Deploy from the repo root (the build context):
#   fly deploy . --config infra/fly/api.toml
# Secrets and first-time setup: infra/fly/README.md.

app = "kpi-nexus-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Migrations + RLS/hypertable SQL, once per deploy before new machines start.
  # A failure aborts the deploy and leaves the running release untouched.
  release_command = "node node_modules/@kpi-nexus/db/scripts/release-db.mjs"
  strategy = "rolling"

[processes]
  # The API leaves the queue processors to the worker (OT-003). `env` sets the
  # flag for this process only: the worker refuses RUN_QUEUE_WORKERS=false.
  app = "env RUN_QUEUE_WORKERS=false node --import ./dist/instrumentation.js dist/main.js"
  worker = "node dist/worker.js"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  LOG_LEVEL = "info"
  RLS_ENFORCED = "true"
  # One Fly proxy in front: trust exactly one X-Forwarded-For hop (OT-009).
  TRUST_PROXY = "1"
  # The ML sidecar on Fly's private network (flycast), never public.
  ML_SIDECAR_URL = "http://kpi-nexus-ml.flycast"

[http_service]
  processes = ["app"]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

# Spec §10.2: 256 MB, scaling to 2 on load. Measured in the local rehearsal
# after the full integration suite: API ~157 MiB, worker ~126 MiB.
[[vm]]
  processes = ["app"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
