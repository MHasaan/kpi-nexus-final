# KPI Nexus ML sidecar on Fly.io (OT-011). Private network only: the API calls
# it at http://kpi-nexus-ml.flycast with HMAC-signed requests.
# Deploy with apps/ml as the build context:
#   fly deploy apps/ml --config infra/fly/ml.toml

app = "kpi-nexus-ml"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Refuses the dev HMAC secret (ML_SIDECAR_HMAC_SECRET must be a real secret).
  ENV = "production"

# No public IPs: allocate a private (flycast) address only, see README.
[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/health"

# Spec §10.2: 512 MB.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
